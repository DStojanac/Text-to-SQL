model_name: google/flan-t5-base

# LoRA
use_lora: true
lora_rank: 8
lora_alpha: 16
lora_target_modules:
  - q
  - v
lora_dropout: 0.1

# Data — use mt10
train_file: data/processed/spider_train_linked_mt10.jsonl
dev_file: data/processed/spider_dev_linked_mt10.jsonl
train_subset_size: 500
dev_subset_size: 50

# Tokenization
max_input_length: 512
max_target_length: 256

# Training — EXACT Tier 1 per-step setup: batch 2 x accum 16 = effective 32
num_train_epochs: 3
learning_rate: 3e-4
weight_decay: 0.01
per_device_train_batch_size: 2
per_device_eval_batch_size: 2
gradient_accumulation_steps: 16
warmup_ratio: 0.1
lr_scheduler_type: linear
seed: 42

# Precision — pure FP32
fp16: false
bf16: false
allow_tf32: false

gradient_checkpointing: false

# Eval + saving — eval every 25 steps so we see a signal quickly
eval_strategy: steps
eval_steps: 25
save_strategy: steps
save_steps: 25
save_total_limit: 2
load_best_model_at_end: true
metric_for_best_model: eval_loss
greater_is_better: false

# Early stopping — generous so a full 3 epochs actually runs (94 steps total)
early_stopping_patience: 10

# Generation during eval
predict_with_generate: true
generation_max_length: 256

# Logging — every step so we see gradient norms early
logging_steps: 5

# Output
output_dir: outputs/checkpoints/flan_t5_base_a100_diagnostic
