model_name: google/flan-t5-base

# LoRA
use_lora: true
lora_rank: 16
lora_alpha: 32
lora_target_modules:
  - q
  - k
  - v
  - o
lora_dropout: 0.05

# Data
train_file: data/processed/spider_train_linked_mt10.jsonl
dev_file: data/processed/spider_dev_linked_mt10.jsonl
train_subset_size: null
dev_subset_size: null

# Tokenization
max_input_length: 512
max_target_length: 256

# Training
num_train_epochs: 10
learning_rate: 3e-4
weight_decay: 0.01
per_device_train_batch_size: 8
per_device_eval_batch_size: 8
gradient_accumulation_steps: 4
warmup_ratio: 0.06
lr_scheduler_type: cosine

# Precision
fp16: false
bf16: true

# Memory optimization
gradient_checkpointing: true

# Evaluation & saving
eval_strategy: epoch
save_strategy: epoch
save_total_limit: 3
load_best_model_at_end: true
metric_for_best_model: exact_match
greater_is_better: true

# Early stopping
early_stopping_patience: 5

# Generation during eval
predict_with_generate: true
generation_max_length: 256

# Logging
logging_steps: 25

# Output
output_dir: outputs/checkpoints/flan_t5_base_a100_improved
